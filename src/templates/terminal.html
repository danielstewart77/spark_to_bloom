{% extends "layout.html" %}
{% block content %}
<main class="terminal-page">
    <!-- Server-rendered data seed + no-JS fallback. Hidden; the mobile UI below is
         built from this (and refreshed from /api/terminal/selector). -->
    <select id="mind-select" class="term-ssr-seed" hidden aria-hidden="true" tabindex="-1">
        {% for mind in selector_minds %}
        <optgroup label="{{ mind.name }} · {{ mind.id[:8] }}">
            <option value="new:{{ mind.id }}"
                    data-action="new"
                    data-mind-id="{{ mind.id }}"
                    data-mind-name="{{ mind.name }}">— new session for {{ mind.name }} —</option>
            {% for session in mind.sessions %}
            <option value="session:{{ session.id }}"
                    data-action="load"
                    data-session-id="{{ session.id }}"
                    data-mind-id="{{ mind.id }}"
                    data-mind-name="{{ mind.name }}"
                    data-status="{{ session.status }}"
                    data-short-id="{{ session.short_id }}"
                    data-age="{{ session.age }}"
                    data-last-active="{{ session.last_active }}"
                    data-summary="{{ session.summary }}">{{ mind.name }} · {{ session.short_id }} · {{ session.status }} · {{ session.age }}{% if session.summary %} · {{ session.summary[:48] }}{% endif %}</option>
            {% endfor %}
        </optgroup>
        {% endfor %}
    </select>

    <div class="term-app" id="term-app" data-view="list">
        <!-- ── Sessions list (the "agents" list) ───────────────────── -->
        <section class="term-list-view" id="term-list-view">
            <header class="term-list-head">
                <h1 class="term-list-title">Agents</h1>
                <div class="term-seg" role="tablist" aria-label="session filter">
                    <button id="term-tab-active" class="term-seg-btn is-active" type="button"
                            role="tab" aria-selected="true" data-filter="active">Active</button>
                    <button id="term-tab-archived" class="term-seg-btn" type="button"
                            role="tab" aria-selected="false" data-filter="archived">Archived</button>
                </div>
                <button id="term-refresh" class="term-action-btn" type="button" title="refresh session list">↻</button>
            </header>
            <div id="term-list" class="term-list" aria-live="polite"></div>
            <p id="term-list-empty" class="term-list-empty" hidden>No sessions.</p>
        </section>

        <!-- ── Conversation (engaged session) ──────────────────────── -->
        <section class="term-convo-view" id="term-convo-view">
            <header class="term-convo-head">
                <button id="term-back" class="term-icon-btn" type="button" title="back to sessions" aria-label="back to sessions">‹ sessions</button>
                <span id="term-session-info" class="term-session-info">no session</span>
                <button id="term-speaker-btn" class="term-action-btn" type="button" title="toggle Skippy voice playback" aria-pressed="false">speaker off</button>
                <button id="term-delete-session" class="term-action-btn term-action-btn-danger" type="button" title="delete this session" hidden>delete</button>
            </header>
            <div id="term-feed" class="term-feed" aria-live="polite"></div>
            <form id="term-input-form" class="term-input-bar" autocomplete="off">
                <span class="term-prompt">&gt;</span>
                <textarea id="term-input" class="term-input" rows="1" placeholder="type a message…" aria-label="message"></textarea>
                <button id="term-mic-btn" type="button" class="term-send-btn" title="hold or toggle to dictate" hidden>mic</button>
                <button type="submit" class="term-send-btn">send</button>
            </form>
        </section>
    </div>
</main>

<script>
(function () {
    const termApp = document.getElementById("term-app");
    const feed = document.getElementById("term-feed");
    const form = document.getElementById("term-input-form");
    const input = document.getElementById("term-input");
    const mindSelect = document.getElementById("mind-select");
    const sessionInfo = document.getElementById("term-session-info");
    const deleteSessionBtn = document.getElementById("term-delete-session");
    const refreshBtn = document.getElementById("term-refresh");
    const listEl = document.getElementById("term-list");
    const listEmpty = document.getElementById("term-list-empty");
    const backBtn = document.getElementById("term-back");
    const tabActive = document.getElementById("term-tab-active");
    const tabArchived = document.getElementById("term-tab-archived");

    const ACTIVE_STATUSES = new Set(["running", "idle"]);
    let currentFilter = "active";
    let lastMinds = [];

    let currentSessionId = null;
    let currentMindId = null;
    let currentMindName = null;
    let eventSource = null;
    let currentAssistantEl = null;
    let reattachTimer = null;
    let reattachStartedAt = 0;
    let sessionWasClosed = false;
    let inFlight = false;
    let pendingUserText = null;
    let pendingUserEl = null;
    let pendingPill = null;
    let assistantDoneTimer = null;
    const ASSISTANT_IDLE_MS = 1500;
    const isWide = () => window.matchMedia("(min-width: 860px)").matches;

    function showView(name) { termApp.dataset.view = name; }

    async function flushQueuedMessage() {
        if (!pendingUserText || !currentSessionId) return;
        const textToSend = pendingUserText;
        const elToSend = pendingUserEl;
        pendingUserEl = null; pendingUserText = null;
        if (pendingPill) { pendingPill.remove(); pendingPill = null; }
        if (elToSend) elToSend.classList.remove("term-pending");
        try {
            await fetch("/api/console/" + currentSessionId + "/message", {
                method: "POST",
                credentials: "same-origin",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({text: textToSend}),
            });
        } catch(err) {
            appendLine("term-system", "send error: " + err.message);
        }
    }

    function scheduleAssistantDone() {
        if (assistantDoneTimer) clearTimeout(assistantDoneTimer);
        assistantDoneTimer = setTimeout(function() {
            assistantDoneTimer = null;
            inFlight = false;
            currentAssistantEl = null;
            flushQueuedMessage();
        }, ASSISTANT_IDLE_MS);
    }

    function cancelAssistantDone() {
        if (assistantDoneTimer) { clearTimeout(assistantDoneTimer); assistantDoneTimer = null; }
    }

    function appendLine(cls, text) {
        currentAssistantEl = null;
        const el = document.createElement("div");
        el.className = "term-line " + cls;
        el.textContent = text;
        feed.appendChild(el);
        feed.scrollTop = feed.scrollHeight;
        return el;
    }

    function startAssistantLine(mindName) {
        currentAssistantEl = document.createElement("div");
        currentAssistantEl.className = "term-line term-assistant";
        currentAssistantEl.dataset.prefix = (mindName || "ada") + " > ";
        currentAssistantEl.textContent = currentAssistantEl.dataset.prefix;
        feed.appendChild(currentAssistantEl);
        feed.scrollTop = feed.scrollHeight;
    }

    function appendAssistantChunk(text) {
        if (!currentAssistantEl) return;
        currentAssistantEl.textContent += text;
        feed.scrollTop = feed.scrollHeight;
    }

    function flattenContent(v) {
        if (v == null) return "";
        if (typeof v === "string") return v;
        if (Array.isArray(v)) return v.map(flattenContent).join("");
        if (typeof v === "object") {
            if (typeof v.text === "string") return v.text;
            if (v.content != null) return flattenContent(v.content);
            return "";
        }
        return String(v);
    }
    function extractText(event) {
        const v = event.content || event.delta || event.text ||
            (event.message && (event.message.content || event.message.text)) || "";
        return flattenContent(v);
    }

    function handleEvent(event) {
        if (event.type === "assistant") {
            inFlight = true;
            if (pendingUserEl && !pendingPill) {
                const pill = document.createElement("button");
                pill.type = "button";
                pill.className = "term-interrupt-pill";
                pill.textContent = "interrupt";
                pill.addEventListener("click", function() { doInterrupt(pill); });
                pendingUserEl.appendChild(pill);
                pendingPill = pill;
            }
            const chunk = extractText(event);
            if (!chunk) return;
            if (!currentAssistantEl) startAssistantLine(currentMindName);
            appendAssistantChunk(chunk);
            ttsAccumulate(chunk);
            scheduleTtsFlush();
            scheduleAssistantDone();
        } else if (event.type === "user") {
            const text = extractText(event);
            if (pendingUserEl && text === pendingUserText) {
                pendingUserEl.classList.remove("term-pending");
                if (pendingPill) { pendingPill.remove(); pendingPill = null; }
                pendingUserEl = null;
                pendingUserText = null;
                inFlight = false;
            } else if (text) {
                appendLine("term-user", "> " + text);
            }
            flushTtsNow();
        } else if (event.type === "result") {
            cancelAssistantDone();
            inFlight = false;
            currentAssistantEl = null;
            flushTtsNow();
            flushQueuedMessage();
        } else if (event.type === "session_closed") {
            cancelAssistantDone();
            currentAssistantEl = null;
            inFlight = false;
            pendingUserEl = null; pendingUserText = null; pendingPill = null;
            sessionWasClosed = true;
            disconnectStream();
            beginReattachLoop();
        }
        // tool events are intentionally ignored
    }

    function disconnectStream() {
        if (eventSource) { eventSource.close(); eventSource = null; }
    }

    function connectStream(sessionId) {
        disconnectStream();
        eventSource = new EventSource("/api/console/" + sessionId + "/stream");
        eventSource.onmessage = function(msg) {
            try { handleEvent(JSON.parse(msg.data)); } catch(e) {}
        };
        eventSource.onerror = function() {
            if (sessionWasClosed) return;
            setTimeout(function() {
                if (currentSessionId === sessionId && !sessionWasClosed) connectStream(sessionId);
            }, 3000);
        };
    }

    function cancelReattachLoop() {
        if (reattachTimer) { clearTimeout(reattachTimer); reattachTimer = null; }
    }

    function beginReattachLoop() {
        cancelReattachLoop();
        if (!currentMindId) {
            appendLine("term-system", "— session closed —");
            return;
        }
        reattachStartedAt = Date.now();
        appendLine("term-system", "session rotated — reattaching to " + (currentMindName || "mind") + "…");
        pollForSuccessor();
    }

    async function pollForSuccessor() {
        if (!currentMindId) return;
        const deadId = currentSessionId || "";
        const mindId = currentMindId;
        try {
            const resp = await fetch(
                "/api/terminal/active?mind_id=" + encodeURIComponent(mindId) +
                "&exclude=" + encodeURIComponent(deadId),
                {credentials: "same-origin"}
            );
            if (resp.status === 200) {
                const successor = await resp.json();
                if (successor && successor.id) {
                    attachSuccessor(successor);
                    return;
                }
            }
        } catch(err) { /* swallow; retry below */ }

        const elapsed = Date.now() - reattachStartedAt;
        if (elapsed >= 30000) {
            try {
                const created = await fetch("/api/terminal/session", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({mind_id: mindId}),
                });
                if (created.ok) {
                    const sess = await created.json();
                    attachSuccessor(sess);
                    return;
                }
            } catch(err) { /* fall through */ }
            appendLine("term-system", "reattach failed — go back and pick a session to retry");
            return;
        }
        reattachTimer = setTimeout(pollForSuccessor, 2000);
    }

    function attachSuccessor(session) {
        cancelReattachLoop();
        sessionWasClosed = false;
        appendLine("term-system", "reattached to " + (session.id || "").slice(0, 8));
        currentSessionId = session.id;
        currentMindId = session.mind_id || currentMindId;
        sessionInfo.textContent = (currentMindName || (session.mind_id || "").slice(0, 8)) + " · " + (session.status || "running");
        rememberSession(session.id);
        connectStream(session.id);
        refreshSelector(session.id);
    }

    function rememberSession(sessionId) {
        try { if (sessionId) localStorage.setItem("term-session", sessionId); } catch(e) {}
    }
    function recalledSession() {
        try { return localStorage.getItem("term-session") || ""; } catch(e) { return ""; }
    }

    async function setSession(session) {
        cancelReattachLoop();
        cancelAssistantDone();
        sessionWasClosed = false;
        currentSessionId = session.id;
        currentMindId = session.mind_id || currentMindId;
        if (session.mind_name) currentMindName = session.mind_name;
        sessionInfo.textContent = (currentMindName || (session.mind_id || "").slice(0, 8)) + " · " + (session.status || "running");
        deleteSessionBtn.hidden = false;
        feed.innerHTML = "";
        currentAssistantEl = null;
        inFlight = false;
        pendingUserEl = null; pendingUserText = null; pendingPill = null;
        rememberSession(session.id);

        // Load session history before connecting the live stream
        try {
            const resp = await fetch("/api/terminal/session/" + session.id + "/history", {credentials: "same-origin"});
            if (resp.ok) {
                const data = await resp.json();
                const msgs = data.messages || [];
                for (const m of msgs) {
                    const body = flattenContent(m.content);
                    if (!body) continue;
                    if (m.role === "user") {
                        appendLine("term-user", "> " + body);
                    } else if (m.role === "assistant") {
                        const el = document.createElement("div");
                        el.className = "term-line term-assistant";
                        el.dataset.prefix = (currentMindName || "mind") + " > ";
                        el.textContent = el.dataset.prefix + body;
                        feed.appendChild(el);
                        feed.scrollTop = feed.scrollHeight;
                    }
                }
                if (msgs.length > 0) appendLine("term-system", "— history · live below —");
            }
        } catch(e) { /* swallow — history is optional */ }

        if (session.summary && session.summary !== "New session") {
            appendLine("term-system", "context: " + session.summary);
        }
        connectStream(session.id);
    }

    // ── engage / disengage ────────────────────────────────────────
    function engage(card) {
        setSession({
            id: card.dataset.sessionId,
            mind_id: card.dataset.mindId,
            mind_name: card.dataset.mindName,
            status: card.dataset.status || "running",
            summary: card.dataset.summary || "",
        });
        showView("convo");
        renderCards(lastMinds);   // refresh is-current highlight
        input.focus();
    }

    function disengage() {
        disconnectStream();
        cancelReattachLoop();
        cancelAssistantDone();
        inFlight = false;
        pendingUserEl = null; pendingUserText = null; pendingPill = null;
        showView("list");
        refreshSelector();
    }
    backBtn.addEventListener("click", disengage);

    // ── session list rendering ────────────────────────────────────
    function isActiveStatus(status) {
        return ACTIVE_STATUSES.has((status || "").toLowerCase());
    }
    function statusDotClass(status) {
        const s = (status || "").toLowerCase();
        if (s === "running") return "is-running";
        if (s === "idle") return "is-idle";
        return "is-closed";
    }

    function renderCards(minds) {
        lastMinds = minds || [];
        listEl.innerHTML = "";
        let count = 0;
        lastMinds.forEach(function(mind) {
            const sessions = (mind.sessions || []).filter(function(s) {
                const active = isActiveStatus(s.status);
                return currentFilter === "active" ? active : !active;
            });
            if (!sessions.length) return;
            const group = document.createElement("div");
            group.className = "term-mind-group";
            group.textContent = mind.name;
            listEl.appendChild(group);
            sessions.forEach(function(s) {
                const card = document.createElement("button");
                card.type = "button";
                card.className = "term-card" + (s.id === currentSessionId ? " is-current" : "");
                card.dataset.sessionId = s.id;
                card.dataset.mindId = mind.id;
                card.dataset.mindName = mind.name;
                card.dataset.status = s.status || "";
                card.dataset.summary = s.summary || "";

                const dot = document.createElement("span");
                dot.className = "term-card-dot " + statusDotClass(s.status);

                const body = document.createElement("span");
                body.className = "term-card-body";
                const title = document.createElement("span");
                title.className = "term-card-title";
                title.innerHTML = '<span class="term-card-name"></span> <span class="term-card-id"></span>';
                title.querySelector(".term-card-name").textContent = mind.name;
                title.querySelector(".term-card-id").textContent = s.short_id || (s.id || "").slice(0, 8);
                const meta = document.createElement("span");
                meta.className = "term-card-meta";
                meta.textContent = (s.status || "") + (s.age ? " · " + s.age : "");
                body.appendChild(title);
                body.appendChild(meta);
                if (s.summary) {
                    const sum = document.createElement("span");
                    sum.className = "term-card-summary";
                    sum.textContent = s.summary;
                    body.appendChild(sum);
                }

                card.appendChild(dot);
                card.appendChild(body);
                card.addEventListener("click", function() { engage(card); });
                listEl.appendChild(card);
                count += 1;
            });
        });
        listEmpty.hidden = count > 0;
        listEmpty.textContent = currentFilter === "active"
            ? "No active sessions."
            : "No archived sessions.";
    }

    async function refreshSelector(preserveSessionId) {
        try {
            const resp = await fetch("/api/terminal/selector", {credentials: "same-origin"});
            if (!resp.ok) return;
            const data = await resp.json();
            rebuildSelector(data, preserveSessionId || currentSessionId);
        } catch(err) { /* swallow */ }
    }

    function rebuildSelector(minds, preserveSessionId) {
        // keep the hidden seed select in sync (no-JS fallback + reattach source)
        mindSelect.innerHTML = "";
        (minds || []).forEach(function(mind) {
            const group = document.createElement("optgroup");
            group.label = mind.name + " · " + (mind.id || "").slice(0, 8);
            const newOpt = document.createElement("option");
            newOpt.value = "new:" + mind.id;
            newOpt.dataset.action = "new";
            newOpt.dataset.mindId = mind.id;
            newOpt.dataset.mindName = mind.name;
            newOpt.textContent = "— new session for " + mind.name + " —";
            group.appendChild(newOpt);
            (mind.sessions || []).forEach(function(s) {
                const opt = document.createElement("option");
                opt.value = "session:" + s.id;
                opt.dataset.action = "load";
                opt.dataset.sessionId = s.id;
                opt.dataset.mindId = mind.id;
                opt.dataset.mindName = mind.name;
                opt.dataset.status = s.status || "";
                opt.dataset.summary = s.summary || "";
                opt.textContent = mind.name + " · " + s.short_id + " · " + s.status + " · " + s.age;
                group.appendChild(opt);
            });
            mindSelect.appendChild(group);
        });
        void preserveSessionId;
        renderCards(minds || []);
    }

    // ── filter tabs ───────────────────────────────────────────────
    function setFilter(filter) {
        currentFilter = filter;
        const activeSel = filter === "active";
        tabActive.classList.toggle("is-active", activeSel);
        tabArchived.classList.toggle("is-active", !activeSel);
        tabActive.setAttribute("aria-selected", activeSel ? "true" : "false");
        tabArchived.setAttribute("aria-selected", activeSel ? "false" : "true");
        renderCards(lastMinds);
    }
    tabActive.addEventListener("click", function() { setFilter("active"); });
    tabArchived.addEventListener("click", function() { setFilter("archived"); });

    if (refreshBtn) refreshBtn.addEventListener("click", function() { refreshSelector(); });

    deleteSessionBtn.addEventListener("click", async function() {
        if (!currentSessionId) return;
        if (!confirm("Delete this session? This cannot be undone.")) return;
        const sessionId = currentSessionId;
        deleteSessionBtn.disabled = true;
        deleteSessionBtn.textContent = "deleting…";
        try {
            const resp = await fetch("/api/terminal/session/" + sessionId, {
                method: "DELETE",
                credentials: "same-origin",
            });
            if (!resp.ok) {
                let msg = "HTTP " + resp.status;
                try { const d = await resp.json(); msg = d.detail || d.error || msg; } catch {}
                appendLine("term-system", "delete failed: " + msg);
            } else {
                disconnectStream();
                cancelReattachLoop();
                currentSessionId = null;
                feed.innerHTML = "";
                sessionInfo.textContent = "no session";
                deleteSessionBtn.hidden = true;
                showView("list");
                await refreshSelector();
            }
        } catch(err) {
            appendLine("term-system", "delete error: " + err.message);
        } finally {
            deleteSessionBtn.disabled = false;
            deleteSessionBtn.textContent = "delete";
        }
    });

    function autoGrowInput() {
        input.style.height = "auto";
        input.style.height = input.scrollHeight + "px";
    }
    input.addEventListener("input", autoGrowInput);
    input.addEventListener("keydown", function(e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            form.requestSubmit();
        }
    });
    setTimeout(autoGrowInput, 0);

    async function doInterrupt(pill) {
        pill.disabled = true;
        pill.textContent = "interrupting…";
        const queuedText = pendingUserText;
        const sessionId = currentSessionId;
        try {
            await fetch("/api/console/" + sessionId + "/interrupt", {
                method: "POST",
                credentials: "same-origin",
            });
        } catch(e) {
            pill.disabled = false;
            pill.textContent = "interrupt";
            return;
        }
        if (queuedText) {
            try {
                await fetch("/api/console/" + sessionId + "/message", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({text: queuedText}),
                });
            } catch(err) {
                appendLine("term-system", "send error: " + err.message);
                if (pendingUserEl) {
                    pendingUserEl.remove();
                    pendingUserEl = null; pendingUserText = null; pendingPill = null;
                }
            }
        }
    }

    form.addEventListener("submit", async function(e) {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || !currentSessionId) return;
        input.value = "";
        autoGrowInput();
        currentAssistantEl = null;

        const wasInFlight = inFlight;

        if (!pendingUserEl) {
            const lineEl = document.createElement("div");
            lineEl.className = "term-line term-user term-pending";
            lineEl.textContent = "> " + text;
            if (wasInFlight) {
                const pill = document.createElement("button");
                pill.type = "button";
                pill.className = "term-interrupt-pill";
                pill.textContent = "interrupt";
                pill.addEventListener("click", function() { doInterrupt(pill); });
                lineEl.appendChild(pill);
                pendingPill = pill;
            }
            feed.appendChild(lineEl);
            feed.scrollTop = feed.scrollHeight;
            pendingUserEl = lineEl;
            pendingUserText = text;
        }

        if (wasInFlight) return;

        try {
            await fetch("/api/console/" + currentSessionId + "/message", {
                method: "POST",
                credentials: "same-origin",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({text: text}),
            });
        } catch(err) {
            appendLine("term-system", "send error: " + err.message);
            if (pendingUserEl) {
                pendingUserEl.remove();
                pendingUserEl = null; pendingUserText = null; pendingPill = null;
            }
        }
    });

    // --- Voice output (Skippy TTS) ---
    const speakerBtn = document.getElementById("term-speaker-btn");
    const audioEl = new Audio();
    audioEl.preload = "auto";
    let speakerOn = false;
    let ttsBuffer = "";
    let ttsFlushTimer = null;
    let ttsPlaying = false;
    const ttsQueue = [];

    function loadSpeakerPref() {
        try { return localStorage.getItem("term-speaker") === "on"; }
        catch(e) { return false; }
    }
    function saveSpeakerPref(on) {
        try { localStorage.setItem("term-speaker", on ? "on" : "off"); }
        catch(e) {}
    }
    function setSpeakerLabel() {
        if (!speakerBtn) return;
        speakerBtn.textContent = speakerOn ? "speaker on" : "speaker off";
        speakerBtn.setAttribute("aria-pressed", speakerOn ? "true" : "false");
        speakerBtn.classList.toggle("term-speaker-on", speakerOn);
    }
    function ttsAccumulate(chunk) {
        if (!speakerOn) return;
        ttsBuffer += chunk;
    }
    function scheduleTtsFlush() {
        if (!speakerOn) return;
        if (ttsFlushTimer) clearTimeout(ttsFlushTimer);
        ttsFlushTimer = setTimeout(flushTtsNow, 1500);
    }
    async function flushTtsNow() {
        if (ttsFlushTimer) { clearTimeout(ttsFlushTimer); ttsFlushTimer = null; }
        const text = ttsBuffer.trim();
        ttsBuffer = "";
        if (!speakerOn || !text) return;
        const voiceId = currentMindName || "default";
        try {
            const resp = await fetch("/api/terminal/tts", {
                method: "POST",
                credentials: "same-origin",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({text: text, voice_id: voiceId}),
            });
            if (!resp.ok) return;
            const blob = await resp.blob();
            ttsQueue.push(URL.createObjectURL(blob));
            playNextTtsClip();
        } catch(err) { /* swallow */ }
    }
    function playNextTtsClip() {
        if (ttsPlaying) return;
        const url = ttsQueue.shift();
        if (!url) return;
        ttsPlaying = true;
        audioEl.src = url;
        audioEl.play().catch(function() { ttsPlaying = false; URL.revokeObjectURL(url); });
        audioEl.onended = function() {
            URL.revokeObjectURL(url);
            ttsPlaying = false;
            playNextTtsClip();
        };
    }
    if (speakerBtn) {
        speakerOn = loadSpeakerPref();
        setSpeakerLabel();
        speakerBtn.addEventListener("click", function() {
            speakerOn = !speakerOn;
            saveSpeakerPref(speakerOn);
            setSpeakerLabel();
            if (!speakerOn) {
                ttsBuffer = "";
                if (ttsFlushTimer) { clearTimeout(ttsFlushTimer); ttsFlushTimer = null; }
                ttsQueue.length = 0;
                try { audioEl.pause(); audioEl.src = ""; } catch(e) {}
                ttsPlaying = false;
            }
        });
    }

    // --- Voice input (Web Speech API) ---
    const micBtn = document.getElementById("term-mic-btn");
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let micActive = false;
    let micFinalText = "";

    function setMicLabel(state) {
        if (!micBtn) return;
        if (state === "on") {
            micBtn.textContent = "listening…";
            micBtn.classList.add("term-mic-on");
        } else if (state === "error") {
            micBtn.textContent = "mic error";
            micBtn.classList.remove("term-mic-on");
        } else {
            micBtn.textContent = "mic";
            micBtn.classList.remove("term-mic-on");
        }
    }

    if (SpeechRecognitionCtor && micBtn) {
        micBtn.hidden = false;
        recognition = new SpeechRecognitionCtor();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = (navigator.language || "en-US");

        recognition.onresult = function(event) {
            let finalText = "";
            let interim = "";
            for (let i = 0; i < event.results.length; i++) {
                const res = event.results[i];
                const transcript = res[0] && res[0].transcript ? res[0].transcript : "";
                if (res.isFinal) {
                    finalText += (finalText ? " " : "") + transcript.trim();
                } else {
                    interim += transcript;
                }
            }
            const preserved = micFinalText ? micFinalText + " " : "";
            input.value = (preserved + finalText + " " + interim).replace(/\s+/g, " ").trim();
            autoGrowInput();
        };

        recognition.onerror = function() {
            setMicLabel("error");
            micActive = false;
        };

        recognition.onend = function() {
            if (micActive) {
                micFinalText = input.value.trim();
                try { recognition.start(); } catch(e) { micActive = false; setMicLabel("off"); }
            } else {
                setMicLabel("off");
            }
        };

        micBtn.addEventListener("click", function() {
            if (!micActive) {
                micFinalText = input.value.trim();
                try {
                    recognition.start();
                    micActive = true;
                    setMicLabel("on");
                    input.focus();
                } catch(e) {
                    setMicLabel("error");
                }
            } else {
                micActive = false;
                try { recognition.stop(); } catch(e) {}
                setMicLabel("off");
            }
        });

        form.addEventListener("submit", function() {
            if (micActive) {
                micActive = false;
                try { recognition.stop(); } catch(e) {}
                setMicLabel("off");
            }
            micFinalText = "";
        });
    }

    // ── boot: build the initial list from the SSR seed, then refresh live ──
    function mindsFromSeed() {
        const groups = Array.from(mindSelect.querySelectorAll("optgroup"));
        return groups.map(function(g) {
            const opts = Array.from(g.querySelectorAll('option[data-action="load"]'));
            const first = g.querySelector('option[data-action="new"]');
            return {
                id: (first && first.dataset.mindId) || (opts[0] && opts[0].dataset.mindId) || "",
                name: (first && first.dataset.mindName) || (opts[0] && opts[0].dataset.mindName) || "mind",
                sessions: opts.map(function(o) {
                    return {
                        id: o.dataset.sessionId,
                        short_id: o.dataset.shortId || (o.dataset.sessionId || "").slice(0, 8),
                        status: o.dataset.status || "",
                        age: o.dataset.age || "",
                        last_active: o.dataset.lastActive || "",
                        summary: o.dataset.summary || "",
                    };
                }),
            };
        });
    }

    showView("list");
    renderCards(mindsFromSeed());
    refreshSelector();

    // On a wide screen, auto-engage the remembered (or most recent active) session
    // so the two-pane desktop layout isn't empty. Mobile lands on the list.
    if (isWide()) {
        const seed = mindsFromSeed();
        let target = null;
        const remembered = recalledSession();
        seed.forEach(function(m) {
            (m.sessions || []).forEach(function(s) {
                if (!isActiveStatus(s.status)) return;
                if (remembered && s.id === remembered) target = {m: m, s: s};
                else if (!target) target = {m: m, s: s};
            });
        });
        if (target) {
            setSession({
                id: target.s.id, mind_id: target.m.id, mind_name: target.m.name,
                status: target.s.status, summary: target.s.summary,
            });
            showView("convo");
        }
    }
})();
</script>
